<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hammad Safi" />
  <meta name="theme-color" content="#fafafa" />
  <title>Hammad Safi — Software Engineer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; }
    body {
      background: #fafaf9;
      color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow-x: hidden;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      display: block;
    }
    /* Light subtle grain */
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.03;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    /* Soft vignette for light mode */
    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(250,250,249,0.5) 100%);
    }
    #scroll-space { position: relative; z-index: 10; height: 600vh; width: 100%; }
    #mark {
      position: fixed; top: 2rem; left: 2rem; z-index: 20;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.75rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: #475569;
      display: flex; align-items: center; gap: 0.6rem;
    }
    #mark .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #10b981; box-shadow: 0 0 10px #10b981;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }
    #progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: linear-gradient(90deg, #0891b2, #4f46e5, #d97706);
      z-index: 20;
    }
    #hint {
      position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%); z-index: 20;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.7rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: #64748b;
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateX(-50%) translateY(0); opacity: 0.7; }
      50%     { transform: translateX(-50%) translateY(6px); opacity: 1; }
    }
    #corner {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 20;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.65rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: #94a3b8;
    }
    /* Hero intro content - light, elegant, dev-themed */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #hero .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0891b2;
      margin-bottom: 1.5rem;
    }
    #hero h1 {
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      text-align: center;
      color: #0f172a;
      margin-bottom: 1rem;
    }
    #hero h1 span {
      font-style: italic;
      font-weight: 400;
      color: #4f46e5;
      font-family: 'Instrument Serif', Georgia, serif;
    }
    #hero p {
      max-width: 520px;
      text-align: center;
      color: #475569;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    #hero .btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      background: #0f172a;
      color: white;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }
    #hero .btn:hover {
      background: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79,70,229,0.25);
    }
    /* Fade out hero as user scrolls */
    #hero.fade { opacity: 0; transform: translateY(-20px); }
    #hero { transition: opacity 0.8s ease, transform 0.8s ease; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div id="progress"></div>
  <div id="mark"><span class="dot"></span> Hammad Safi · Software Engineer</div>

  <div id="hero">
    <div class="tag">// hello_world.exe</div>
    <h1>Hammad Safi <span>builds</span><br/>thoughtful software.</h1>
    <p>AI & software engineer. MSc Computer Science at Hertfordshire. Building intelligent systems at the intersection of ML, web, and mobile.</p>
    <a href="mailto:hammabdullah@gmail.com" class="btn">Get in touch →</a>
  </div>

  <div id="scroll-space"></div>
  <div id="hint">Scroll ↓</div>
  <div id="corner">v1.0 · Hatfield, UK</div>

  <script>
  (() => {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const hero = document.getElementById('hero');
    const progressBar = document.getElementById('progress');
    let w, h, dpr;

    // Light-mode palette (dev-themed)
    const COLORS = {
      cyan: '#0891b2',
      indigo: '#4f46e5',
      amber: '#d97706',
      emerald: '#059669',
      rose: '#e11d48',
      grid: 'rgba(15,23,42,0.04)',
      line: 'rgba(15,23,42,0.12)',
      node: 'rgba(15,23,42,0.5)',
      text: 'rgba(15,23,42,0.18)',
    };

    // Developer symbols floating around
    const SYMBOLS = [
      '{', '}', '()', '=>', '//', '&&', '||', ';',
      'const', 'let', 'fn', 'import', 'export', 'return',
      '0', '1', 'true', 'false', '<>', '/>', '===',
      'async', 'await', 'git', 'push', '#!', '/*', '*/',
      'null', 'undefined', 'map', 'filter', 'reduce',
    ];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // Layer 1: Soft isometric grid that tilts with scroll
    function drawGrid(scrollVel, scrollP) {
      ctx.save();
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      const gridSize = 50;
      const offset = (window.scrollY * 0.3) % gridSize;
      // Perspective effect: grid recedes to horizon based on scroll
      const horizonY = h * (0.45 + Math.sin(scrollP * Math.PI) * 0.1);
      const tilt = scrollVel * 2;
      // Vertical lines
      for (let x = -w; x < w * 2; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x + offset - tilt * 10, h);
        ctx.lineTo(w/2 + (x - w/2) * 0.3, horizonY);
        ctx.stroke();
      }
      // Horizontal lines
      for (let y = horizonY; y < h; y += gridSize * 0.5) {
        const dist = (y - horizonY) / (h - horizonY);
        const width = w * dist + w * 0.3;
        ctx.beginPath();
        ctx.moveTo(w/2 - width/2 + offset * dist, y);
        ctx.lineTo(w/2 + width/2 + offset * dist, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Layer 2: Floating code symbols (parallax, speed tied to scroll velocity)
    const symbols = Array.from({ length: 45 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      text: SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
      size: 10 + Math.random() * 16,
      vx: (Math.random() - 0.5) * 0.2,
      vy: -Math.random() * 0.3 - 0.1,
      alpha: 0.08 + Math.random() * 0.2,
      color: [COLORS.cyan, COLORS.indigo, COLORS.amber, COLORS.emerald, COLORS.rose][Math.floor(Math.random()*5)],
      rotation: (Math.random() - 0.5) * 0.5,
      depth: Math.random(),
    }));

    function drawSymbols(scrollVel, scrollP) {
      ctx.save();
      ctx.font = (size => `500 ${size}px 'JetBrains Mono', monospace`);
      for (const s of symbols) {
        // Scroll affects fall speed - deeper scroll = faster symbols rise
        s.y += s.vy - scrollVel * (0.5 + s.depth);
        s.x += s.vx + Math.sin(s.y * 0.01 + s.depth * 10) * 0.2;
        if (s.y < -50) { s.y = h + 50; s.x = Math.random() * w; }
        if (s.y > h + 50) { s.y = -50; s.x = Math.random() * w; }
        if (s.x < -100) s.x = w + 50;
        if (s.x > w + 100) s.x = -50;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);
        ctx.globalAlpha = s.alpha + Math.sin(scrollP * Math.PI * 2 + s.depth * 10) * 0.05;
        ctx.fillStyle = s.color;
        ctx.font = `${s.size}px 'JetBrains Mono', monospace`;
        ctx.fillText(s.text, 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    // Layer 3: Connection node network (graph-like, nodes connect when close)
    const nodes = Array.from({ length: 35 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: 1.5 + Math.random() * 2,
      alpha: 0.3 + Math.random() * 0.5,
    }));

    function drawNodes(scrollVel) {
      // Movement speed scales with scroll velocity
      const speed = 1 + Math.abs(scrollVel) * 5;
      // Update positions
      for (const n of nodes) {
        n.x += n.vx * speed;
        n.y += n.vy * speed;
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }
      // Draw connections
      ctx.save();
      ctx.lineWidth = 1;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d < 140) {
            const alpha = (1 - d / 140) * 0.25;
            const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
            grad.addColorStop(0, `rgba(8,145,178,${alpha})`);
            grad.addColorStop(1, `rgba(79,70,229,${alpha})`);
            ctx.strokeStyle = grad;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      // Draw nodes
      for (const n of nodes) {
        ctx.fillStyle = `rgba(15,23,42,${n.alpha * 0.7})`;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
        // Glow for some
        if (Math.random() < 0.02) {
          ctx.fillStyle = 'rgba(8,145,178,0.4)';
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // Layer 4: Code rain in the background (faint, like terminal rain)
    const rainCols = Math.floor(w / 22);
    const rain = Array.from({ length: 80 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      speed: 0.5 + Math.random() * 1.5,
      length: 5 + Math.floor(Math.random() * 15),
      chars: Array.from({ length: 20 }, () => Math.random() < 0.5 ? '0' : '1').join(''),
    }));

    function drawRain(scrollVel) {
      ctx.save();
      ctx.font = '12px JetBrains Mono, monospace';
      ctx.fillStyle = 'rgba(8,145,178,0.07)';
      for (const c of rain) {
        c.y += c.speed * (1 + Math.abs(scrollVel) * 8);
        if (c.y > h + 100) { c.y = -100; c.x = Math.random() * w; }
        for (let i = 0; i < c.length; i++) {
          const ch = Math.random() < 0.1 ? String.fromCharCode(48 + Math.floor(Math.random()*2)) : ' ';
          ctx.fillText(ch || '0', c.x, c.y - i * 14);
        }
      }
      ctx.restore();
    }

    // Layer 5: Large soft light blobs that drift with scroll
    const blobs = [
      { x: 0.2, y: 0.3, r: 400, color: 'rgba(8,145,178,0.08)',  vx: 0.0001 },
      { x: 0.8, y: 0.7, r: 500, color: 'rgba(79,70,229,0.08)', vx: -0.0001 },
      { x: 0.5, y: 0.1, r: 350, color: 'rgba(217,119,6,0.06)',  vx: 0.00005 },
    ];
    function drawBlobs(scrollP) {
      for (const b of blobs) {
        const px = (b.x + Math.sin(scrollP * Math.PI * 2) * 0.05) * w;
        const py = (b.y + Math.cos(scrollP * Math.PI * 2) * 0.05) * h;
        const grad = ctx.createRadialGradient(px, py, 0, px, py, b.r);
        grad.addColorStop(0, b.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }
    }

    // Scroll tracking
    let lastScrollY = window.scrollY;
    let scrollVel = 0;
    function getProgress() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      return max <= 0 ? 0 : window.scrollY / max;
    }

    function frame() {
      ctx.clearRect(0, 0, w, h);

      const p = getProgress();
      const dy = window.scrollY - lastScrollY;
      scrollVel = scrollVel * 0.9 + dy * 0.001;
      lastScrollY = window.scrollY;

      // Hero fade out
      if (p > 0.08) hero.classList.add('fade');
      else hero.classList.remove('fade');

      progressBar.style.width = (p * 100) + '%';

      // Draw layers (back to front)
      drawBlobs(p);
      drawGrid(scrollVel, p);
      drawRain(scrollVel);
      drawNodes(scrollVel);
      drawSymbols(scrollVel, p);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // Smooth anchor scroll
    document.querySelector('a.btn')?.addEventListener('click', e => {
      e.preventDefault();
      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
    });
  })();
  </script>
</body>
</html>
