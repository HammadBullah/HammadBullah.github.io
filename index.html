<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hammad Safi" />
  <meta name="theme-color" content="#000000" />
  <title>Hammad Safi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    #bg-video-wrap {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0;
      overflow: hidden; background: #05070a;
    }
    #bg-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; transition: opacity 1.2s ease; will-change: transform;
    }
    #bg-video.on { opacity: 1; }
    /* Cinematic fallback gradient + animated code pattern so it never appears black */
    #bg-fallback {
      position: absolute; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse at 25% 30%, rgba(0,180,255,0.18), transparent 55%),
        radial-gradient(ellipse at 75% 70%, rgba(140,70,255,0.15), transparent 55%),
        linear-gradient(135deg, #05070a 0%, #0a0f1a 100%);
      overflow: hidden;
    }
    #bg-fallback::before {
      /* Soft moving lines to simulate "code rain" while video loads/fails */
      content: ''; position: absolute; inset: -20%;
      background:
        repeating-linear-gradient(0deg,
          transparent 0,
          transparent 3px,
          rgba(0,212,255,0.03) 3px,
          rgba(0,212,255,0.03) 4px);
      animation: drift 18s linear infinite;
      mask-image: linear-gradient(180deg, transparent 0%, black 20%, black 80%, transparent 100%);
    }
    @keyframes drift {
      from { transform: translateY(-10%); } to { transform: translateY(10%); }
    }
    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 15%, rgba(0,0,0,0.9) 100%);
    }
    .grain {
      position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0.09;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    #fx { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    #scroll-space { position: relative; z-index: 10; height: 500vh; width: 100%; }
    #mark {
      position: fixed; top: 2rem; left: 2rem; z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.7rem;
      letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.75);
      mix-blend-mode: difference;
    }
    #progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: linear-gradient(90deg, #00d4ff, #8a5cff);
      z-index: 20;
      box-shadow: 0 0 12px rgba(0,212,255,0.6);
      transition: width 0.1s linear;
    }
    #hint {
      position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%); z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.65rem;
      letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.55);
      animation: float 2.5s ease-in-out infinite; mix-blend-mode: difference;
    }
    @keyframes float {
      0%,100% { transform: translateX(-50%) translateY(0); opacity: 0.55; }
      50%     { transform: translateX(-50%) translateY(6px); opacity: 0.9; }
    }
    /* Admin notice (hidden when bg.mp4 exists) */
    #setup {
      position: fixed; bottom: 4rem; left: 50%; transform: translateX(-50%); z-index: 19;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.65rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.45);
      text-align: center; max-width: 80vw; mix-blend-mode: difference;
    }
    #setup.hidden { display: none; }
  </style>
</head>
<body>
  <div id="bg-video-wrap">
    <!--
      To use the Jakub Zerdzicki / Pexels video:
        1. Download the MP4 from https://www.pexels.com/download/video/33187808/
        2. Save it as "bg.mp4" inside the /public folder (repo root).
        3. Deploy. It will be picked up automatically.
      Until then we fall back to a working CDN abstract clip (royalty-free Mixkit).
    -->
    <video id="bg-video" muted playsinline preload="auto"></video>
    <div id="bg-fallback"></div>
  </div>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div id="progress"></div>
  <div id="mark">HS · 00:00</div>
  <div id="scroll-space"></div>
  <div id="hint">Scroll ↓</div>
  <div id="setup">
    Drop the Jakub Zerdzicki clip as /public/bg.mp4 to replace the default footage
  </div>

  <script>
  (() => {
    const video = document.getElementById('bg-video');
    const mark = document.getElementById('mark');
    const progress = document.getElementById('progress');
    const fx = document.getElementById('fx');
    const fxCtx = fx.getContext('2d');
    const setup = document.getElementById('setup');

    // Prefer local bg.mp4 if present (Pexels clip you added), else CDN fallback.
    const candidates = [
      '/bg.mp4?t=' + Date.now(), // bust cache, check for user-supplied file
      'https://assets.mixkit.co/videos/4793/4793-720.mp4', // reliable fallback
    ];
    let idx = 0;
    function tryNext() {
      if (idx >= candidates.length) { setup.classList.remove('hidden'); return; }
      video.src = candidates[idx];
      video.load();
    }
    video.addEventListener('loadeddata', () => {
      // Local file succeeded → hide setup note
      if (idx === 0) setup.classList.add('hidden');
      video.play().then(() => video.classList.add('on')).catch(()=>{});
    });
    video.addEventListener('error', () => {
      idx++; tryNext();
    });
    tryNext();

    // Hide the setup hint if /bg.mp4 returns 200 locally (pre-flight)
    fetch('/bg.mp4', { method: 'HEAD' }).then(r => {
      if (r.ok && r.status !== 404 && r.headers.get('content-type')?.includes('video')) {
        setup.classList.add('hidden');
      }
    }).catch(()=>{});

    function scrollP() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      return max <= 0 ? 0 : window.scrollY / max;
    }
    function fmt(p) {
      const secs = Math.floor(p * 60);
      return String(Math.floor(secs/60)).padStart(2,'0') + ':' + String(secs%60).padStart(2,'0');
    }

    let rafPending = false;
    function onScroll() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        const p = scrollP();
        progress.style.width = (p * 100) + '%';
        mark.textContent = 'HS · ' + fmt(p);
        if (video.readyState >= 2 && isFinite(video.duration) && video.duration > 0.5) {
          const tgt = p * (video.duration - 0.1);
          if (Math.abs(video.currentTime - tgt) > 0.12) {
            try { video.currentTime = tgt; } catch(e){}
          }
        }
        video.style.transform = 'scale(' + (1.08 + p * 0.12) + ')';
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    // Dust motes
    let fxW, fxH;
    function resizeFx() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fxW = window.innerWidth; fxH = window.innerHeight;
      fx.width = fxW * dpr; fx.height = fxH * dpr;
      fx.style.width = fxW + 'px'; fx.style.height = fxH + 'px';
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeFx();
    window.addEventListener('resize', resizeFx);
    const motes = Array.from({ length: 60 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.6 + 0.3,
      vx: (Math.random() - 0.5) * 0.1,
      vy: -Math.random() * 0.25 - 0.04,
      a: Math.random() * 0.5 + 0.15,
    }));
    function tick() {
      fxCtx.clearRect(0, 0, fxW, fxH);
      const p = scrollP();
      for (const m of motes) {
        m.x += m.vx; m.y += m.vy * (1 + p * 1.5);
        if (m.y < -10) { m.y = fxH + 10; m.x = Math.random() * fxW; }
        if (m.x < -10) m.x = fxW + 10; if (m.x > fxW + 10) m.x = -10;
        fxCtx.fillStyle = 'rgba(255,255,255,' + m.a + ')';
        fxCtx.beginPath(); fxCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2); fxCtx.fill();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    onScroll();
  })();
  </script>
</body>
</html>
