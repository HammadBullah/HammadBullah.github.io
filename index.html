<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hammad Safi" />
  <meta name="theme-color" content="#000000" />
  <title>Hammad Safi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    #bg-video-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #bg-video.on { opacity: 1; }
    #bg-fallback {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(0,150,255,0.25), transparent 60%),
        radial-gradient(ellipse at 70% 70%, rgba(150,80,255,0.2), transparent 60%),
        #000;
      transition: opacity 0.8s;
    }
    #bg-video.on ~ #bg-fallback { opacity: 0; }
    #grade {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      mix-blend-mode: soft-light;
      transition: background 1s ease;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.85) 100%);
    }
    .grain {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      opacity: 0.07; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    #fx { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    #scroll-space { position: relative; z-index: 10; height: 800vh; width: 100%; }
    #mark {
      position: fixed; top: 2rem; left: 2rem; z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.7rem;
      letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.7);
      mix-blend-mode: difference;
    }
    #indicator {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.7rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.6);
      display: flex; align-items: center; gap: 0.7rem; mix-blend-mode: difference;
    }
    #indicator .bar { display: flex; gap: 5px; }
    #indicator .bar span {
      display: inline-block; width: 22px; height: 2px;
      background: rgba(255,255,255,0.2); transition: background 0.4s, width 0.4s;
    }
    #indicator .bar span.active { background: #fff; width: 34px; }
    #hint {
      position: fixed; bottom: 4.5rem; left: 50%; transform: translateX(-50%); z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.65rem;
      letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.4);
      animation: float 2.5s ease-in-out infinite; mix-blend-mode: difference;
    }
    @keyframes float {
      0%,100% { transform: translateX(-50%) translateY(0); opacity: 0.4; }
      50%     { transform: translateX(-50%) translateY(6px); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="bg-video-wrap">
    <video id="bg-video" muted playsinline preload="auto"></video>
    <div id="bg-fallback"></div>
  </div>
  <div id="grade"></div>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div id="mark">HS · 00:00</div>
  <div id="scroll-space"></div>
  <div id="hint">Scroll ↓</div>
  <div id="indicator">
    <span id="scene-label">01 / 08</span>
    <div class="bar" id="dots"></div>
  </div>

  <script>
  (() => {
    // Abstract / cinematic art clips from Mixkit (free to use).
    const SCENES = [
      { src: 'https://assets.mixkit.co/videos/4793/4793-720.mp4', tint: 'rgba(0,160,255,0.18)' },   // ink/liquid
      { src: 'https://assets.mixkit.co/videos/4795/4795-720.mp4', tint: 'rgba(140,70,255,0.20)' },   // purple ink
      { src: 'https://assets.mixkit.co/videos/1206/1206-720.mp4', tint: 'rgba(60,110,255,0.20)' },   // blue particles
      { src: 'https://assets.mixkit.co/videos/4791/4791-720.mp4', tint: 'rgba(255,150,50,0.20)' },   // warm light
      { src: 'https://assets.mixkit.co/videos/4801/4801-720.mp4', tint: 'rgba(255,50,170,0.20)' },   // neon pink
      { src: 'https://assets.mixkit.co/videos/4773/4773-720.mp4', tint: 'rgba(255,80,30,0.18)' },    // sparks/fire
      { src: 'https://assets.mixkit.co/videos/1193/1193-720.mp4', tint: 'rgba(0,200,255,0.15)' },    // water ripples
      { src: 'https://assets.mixkit.co/videos/35137/35137-720.mp4', tint: 'rgba(255,255,255,0.08)' },// stars/space
    ];

    const video = document.getElementById('bg-video');
    const grade = document.getElementById('grade');
    const sceneLabel = document.getElementById('scene-label');
    const dotsEl = document.getElementById('dots');
    const mark = document.getElementById('mark');
    const fx = document.getElementById('fx');
    const fxCtx = fx.getContext('2d');

    SCENES.forEach((_, i) => {
      const s = document.createElement('span');
      s.dataset.idx = i;
      dotsEl.appendChild(s);
    });
    const dots = dotsEl.querySelectorAll('span');

    // Preloader — preload first + next clips in hidden videos
    const loaders = [];
    function preload(i) {
      i = Math.max(0, Math.min(SCENES.length - 1, i));
      if (loaders[i]) return loaders[i];
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto';
      v.src = SCENES[i].src;
      v.load();
      loaders[i] = v;
      return v;
    }

    let curIdx = -1;
    function showScene(i) {
      i = Math.max(0, Math.min(SCENES.length - 1, i));
      if (i === curIdx) return;
      const preloaded = loaders[i];
      // Set src either from preloaded one or direct src
      if (preloaded && preloaded.readyState >= 2) {
        // Swap the actual src; fastest way is to re-assign src
        video.src = SCENES[i].src;
      } else {
        video.src = SCENES[i].src;
      }
      video.currentTime = 0;
      video.classList.remove('on');
      const onReady = () => {
        video.play().then(() => video.classList.add('on')).catch(() => video.classList.add('on'));
      };
      if (video.readyState >= 2) onReady();
      else video.addEventListener('loadeddata', onReady, { once: true });
      grade.style.background = SCENES[i].tint;
      curIdx = i;
      preload(i + 1);
      preload(i - 1);
    }

    function prog() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      return max <= 0 ? 0 : window.scrollY / max;
    }

    function tick() {
      const p = prog();
      const scene = Math.max(0, Math.min(SCENES.length - 1, Math.floor(p * SCENES.length)));
      const local = (p * SCENES.length) - scene;
      showScene(scene);

      // Scrub video time based on scroll within the scene
      if (video.readyState >= 2 && isFinite(video.duration) && video.duration > 0) {
        const tgt = local * Math.min(video.duration - 0.05, video.duration * 0.98);
        if (Math.abs(video.currentTime - tgt) > 0.08) {
          try { video.currentTime = tgt; } catch(e){}
        }
      }
      video.style.transform = `scale(${1.05 + p * 0.1})`;

      sceneLabel.textContent = String(scene + 1).padStart(2, '0') + ' / 0' + SCENES.length;
      dots.forEach(d => d.classList.toggle('active', Number(d.dataset.idx) === scene));
      mark.textContent = `HS · ${String(Math.floor(p*100)).padStart(2,'0')}%`;
    }
    window.addEventListener('scroll', tick, { passive: true });

    // Particles
    let fxW, fxH;
    function resizeFx() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fxW = window.innerWidth; fxH = window.innerHeight;
      fx.width = fxW * dpr; fx.height = fxH * dpr;
      fx.style.width = fxW + 'px'; fx.style.height = fxH + 'px';
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeFx();
    window.addEventListener('resize', resizeFx);
    const motes = Array.from({ length: 70 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.8 + 0.4,
      vx: (Math.random() - 0.5) * 0.15,
      vy: -Math.random() * 0.3 - 0.05,
      a: Math.random() * 0.6 + 0.2,
      tw: Math.random() * Math.PI * 2,
    }));
    function fxtick() {
      fxCtx.clearRect(0, 0, fxW, fxH);
      const p = prog();
      for (const m of motes) {
        m.x += m.vx + Math.sin(m.tw) * 0.1;
        m.y += m.vy * (1 + p * 2);
        m.tw += 0.02;
        if (m.y < -10) { m.y = fxH + 10; m.x = Math.random() * fxW; }
        if (m.x < -10) m.x = fxW + 10;
        if (m.x > fxW + 10) m.x = -10;
        fxCtx.fillStyle = p < 0.5 ? `rgba(200,230,255,${m.a})` : `rgba(255,220,190,${m.a})`;
        fxCtx.beginPath();
        fxCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        fxCtx.fill();
      }
      requestAnimationFrame(fxtick);
    }
    requestAnimationFrame(fxtick);

    // Keyboard: Space → next scene
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        const p = prog();
        const cur = Math.floor(p * SCENES.length);
        const nxt = Math.min(SCENES.length - 1, cur + 1);
        const max = document.documentElement.scrollHeight - window.innerHeight;
        window.scrollTo({ top: (nxt / SCENES.length) * max, behavior: 'smooth' });
      }
    });

    // Kick off
    showScene(0);
    tick();
  })();
  </script>
</body>
</html>
