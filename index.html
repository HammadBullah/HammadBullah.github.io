<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hammad Safi" />
  <meta name="theme-color" content="#000000" />
  <title>Hammad Safi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    #bg-video-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease;
      will-change: transform;
    }
    #bg-video.on { opacity: 1; }
    #bg-fallback {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.06), transparent 60%),
        radial-gradient(ellipse at 70% 70%, rgba(255,255,255,0.04), transparent 60%),
        #000;
      transition: opacity 0.8s;
    }
    #bg-video.on ~ #bg-fallback { opacity: 0; }
    /* Grade + vignette + grain layered for cinematic feel */
    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.85) 100%);
    }
    .grain {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      opacity: 0.08; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    #fx { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    #scroll-space { position: relative; z-index: 10; height: 500vh; width: 100%; }

    /* HUD */
    #mark {
      position: fixed; top: 2rem; left: 2rem; z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.7rem;
      letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.75);
      mix-blend-mode: difference;
    }
    #progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: #fff;
      z-index: 20;
      box-shadow: 0 0 12px rgba(255,255,255,0.6);
      transition: width 0.1s linear;
    }
    #hint {
      position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%); z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.65rem;
      letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.55);
      animation: float 2.5s ease-in-out infinite; mix-blend-mode: difference;
    }
    @keyframes float {
      0%,100% { transform: translateX(-50%) translateY(0); opacity: 0.55; }
      50%     { transform: translateX(-50%) translateY(6px); opacity: 0.9; }
    }
    #credit {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 20;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.6rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4);
      mix-blend-mode: difference;
    }
    #credit a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div id="bg-video-wrap">
    <video id="bg-video" muted playsinline preload="auto"></video>
    <div id="bg-fallback"></div>
  </div>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div id="progress"></div>
  <div id="mark">HS · 00:00</div>
  <div id="scroll-space"></div>
  <div id="hint">Scroll ↓</div>
  <div id="credit">
    Footage · <a href="https://www.pexels.com/zh-cn/video/33187808/" target="_blank" rel="noreferrer">Jakub Zerdzicki / Pexels</a>
  </div>

  <script>
  (() => {
    // Single Pexels abstract video by Jakub Zerdzicki — scroll-scrubbed across 5 screens.
    const VIDEO_URL = 'https://videos.pexels.com/video-files/33187808/33187808-hd_1920_1080_30fps.mp4';
    const video = document.getElementById('bg-video');
    const mark = document.getElementById('mark');
    const progress = document.getElementById('progress');
    const fx = document.getElementById('fx');
    const fxCtx = fx.getContext('2d');

    video.src = VIDEO_URL;
    video.crossOrigin = 'anonymous';
    video.addEventListener('loadeddata', () => {
      video.play().then(() => video.classList.add('on')).catch(()=>{});
    }, { once: true });
    video.addEventListener('error', () => {
      // Fall through — fallback gradient stays
    });

    function scrollP() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      return max <= 0 ? 0 : window.scrollY / max;
    }

    function fmt(p) {
      const secs = Math.floor(p * 60);
      const mm = String(Math.floor(secs/60)).padStart(2,'0');
      const ss = String(secs%60).padStart(2,'0');
      return `${mm}:${ss}`;
    }

    let seeking = false;
    function onScroll() {
      const p = scrollP();
      progress.style.width = (p * 100) + '%';
      mark.textContent = `HS · ${fmt(p)}`;

      // Scrub video: as user scrolls from 0→1, seek 0→duration.
      if (video.readyState >= 2 && isFinite(video.duration) && video.duration > 0.5) {
        const tgt = p * (video.duration - 0.1);
        // Smooth seeking: only set when delta is meaningful to avoid jank
        if (!seeking && Math.abs(video.currentTime - tgt) > 0.12) {
          seeking = true;
          const doSeek = () => {
            try { video.currentTime = tgt; } catch(e){}
            seeking = false;
          };
          if ('requestVideoFrameCallback' in video) {
            video.requestVideoFrameCallback(doSeek);
          } else {
            requestAnimationFrame(doSeek);
          }
        }
      }
      // Parallax zoom — slow push-in tied to scroll, feels cinematic
      video.style.transform = `scale(${1.08 + p * 0.12})`;
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    // Drifting dust motes on canvas
    let fxW, fxH;
    function resizeFx() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fxW = window.innerWidth; fxH = window.innerHeight;
      fx.width = fxW * dpr; fx.height = fxH * dpr;
      fx.style.width = fxW + 'px'; fx.style.height = fxH + 'px';
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeFx();
    window.addEventListener('resize', resizeFx);
    const motes = Array.from({ length: 60 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.6 + 0.3,
      vx: (Math.random() - 0.5) * 0.1,
      vy: -Math.random() * 0.25 - 0.04,
      a: Math.random() * 0.5 + 0.15,
    }));
    function tick() {
      fxCtx.clearRect(0, 0, fxW, fxH);
      const p = scrollP();
      for (const m of motes) {
        m.x += m.vx;
        m.y += m.vy * (1 + p * 1.5);
        if (m.y < -10) { m.y = fxH + 10; m.x = Math.random() * fxW; }
        if (m.x < -10) m.x = fxW + 10;
        if (m.x > fxW + 10) m.x = -10;
        fxCtx.fillStyle = `rgba(255,255,255,${m.a})`;
        fxCtx.beginPath();
        fxCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        fxCtx.fill();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    onScroll();
  })();
  </script>
</body>
</html>
